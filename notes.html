<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的文章 · 算法学习笔记本</title>
<meta name="description" content="算法学习笔记本的文章模块：题解、思路复盘、模板与踩坑记录。">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<link rel="stylesheet" href="notes.css">
</head>
<body>

<div class="aurora-bg" aria-hidden="true"></div>

<header id="topbar" class="topbar"></header>

<!-- ============ 列表视图 ============ -->
<main id="listView" class="notes-wrap">

  <div class="notes-head">
    <div>
      <h1>我的文章</h1>
      <p class="muted" id="notesSub">题解、思路复盘、模板与踩坑记录，都存在云端。</p>
    </div>
    <div class="notes-head-actions">
      <div class="view-seg" id="viewSeg" title="列表 / 分栏视图">
        <button class="seg-btn active" data-view="list">列表</button>
        <button class="seg-btn" data-view="board">分栏</button>
      </div>
      <input id="noteSearch" type="search" placeholder="搜索标题 / 摘要 / 标签" autocomplete="off">
      <button id="newNoteBtn" class="btn primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
        写文章
      </button>
    </div>
  </div>

  <div class="notes-tabs" id="notesTabs" hidden>
    <button class="tab-btn active" data-tab="published">已发布</button>
    <button class="tab-btn" data-tab="draft">草稿箱</button>
  </div>

  <div class="board-bar" id="boardBar" hidden>
    <div class="seg" id="boardBySeg" title="分栏依据">
      <button class="seg-btn active" data-by="column">自定义栏</button>
      <button class="seg-btn" data-by="tag">按标签</button>
    </div>
    <button id="manageColBtn" class="btn ghost" data-admin>管理栏</button>
    <span class="board-hint muted small" id="boardHint"></span>
  </div>

  <div class="filter-row" id="tagFilter"></div>

  <div id="noteList" class="note-list"></div>
  <div id="boardView" class="board" hidden></div>

  <div id="notesEmpty" class="empty" hidden>
    <p>还没有文章</p>
    <p class="muted">点右上角「写文章」开始记第一篇</p>
  </div>

</main>

<!-- ============ 编辑器 ============ -->
<main id="editView" class="editor" hidden>

  <div class="ed-bar">
    <button id="edBack" class="btn ghost">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      返回
    </button>
    <span class="ed-status muted small" id="edStatus">草稿</span>
    <div class="spacer"></div>
    <div class="ed-count"><span id="edWords">0</span> 字</div>
    <div class="ed-mode" id="edMode" title="视图切换">
      <button class="seg-btn active" data-mode="edit" title="直接编辑">编辑</button>
      <button class="seg-btn" data-mode="preview" title="查看效果">预览</button>
    </div>
      <button id="delNoteBtn" class="btn ghost" data-admin hidden>删除</button>
      <button id="saveDraftBtn" class="btn ghost" data-admin>存草稿</button>
      <button id="publishBtn" class="btn primary" data-admin>发布</button>
  </div>

  <input id="edTitle" class="ed-title" placeholder="给这篇文章起个标题…" maxlength="120" autocomplete="off">

  <div class="ed-meta-row">
    <input id="edSummary" placeholder="摘要：写一句概括，会显示在文章列表（可留空自动生成）" autocomplete="off">
    <input id="edTags" placeholder="标签，逗号分隔：如 图论, 最短路, CF1900" list="tagList" autocomplete="off">
    <select id="edColumn" class="ed-col" title="所属分栏（自定义栏模式下生效；可在「管理栏」里增删）">
      <option value="">未分栏</option>
    </select>
    <select id="edVisibility" class="ed-visibility" title="发布后谁可见">
      <option value="public">访客模式</option>
      <option value="private">管理员模式</option>
    </select>
  </div>
  <datalist id="tagList">
    <option value="动态规划"></option><option value="图论"></option><option value="最短路"></option>
    <option value="网络流"></option><option value="树形DP"></option><option value="贪心"></option>
    <option value="字符串"></option><option value="数学"></option><option value="数论"></option>
    <option value="组合数学"></option><option value="数据结构"></option><option value="线段树"></option>
    <option value="树状数组"></option><option value="平衡树"></option><option value="搜索"></option>
    <option value="二分答案"></option><option value="分治"></option><option value="构造"></option>
    <option value="模拟"></option><option value="位运算"></option><option value="思维"></option>
    <option value="计算几何"></option><option value="博弈"></option><option value="差分约束"></option>
    <option value="最小生成树"></option><option value="拓扑排序"></option><option value="倍增"></option>
    <option value="DP优化"></option><option value="状压DP"></option><option value="概率期望"></option>
    <option value="前缀和"></option><option value="双指针"></option><option value="滑动窗口"></option>
    <option value="哈希"></option><option value="莫队"></option><option value="后缀数组"></option>
    <option value="CF1900"></option><option value="CF2100"></option><option value="CF2300"></option>
    <option value="Codeforces"></option><option value="ICPC"></option><option value="NOIP"></option>
  </datalist>

  <!-- 工具栏：图标在上，文字在下，分组排列 -->
  <div class="ed-toolbar" id="edToolbar" data-admin>
    <!-- 历史 -->
    <div class="tb-group">
      <button class="tb" data-cmd="undo" title="撤消 Ctrl+Z">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        <span>撤消</span>
      </button>
      <button class="tb" data-cmd="redo" title="重做 Ctrl+Y">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
        <span>重做</span>
      </button>
      <button class="tb" data-cmd="history" title="文章修改时间">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span>历史</span>
      </button>
    </div>

    <!-- 格式 -->
    <div class="tb-group">
      <div class="tb-dropdown" id="formatPickerWrap">
        <button class="tb" data-dropdown="format" title="标题格式">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h8"/><path d="M4 18V6"/><path d="M12 18V6"/><path d="M17 12h3m0 0v6m0-6-4-3.5"/></svg>
          <span>格式</span>
        </button>
        <div class="tb-popover" id="formatPickerPop" hidden>
          <button class="tb-pop-item" data-cmd="h1"><span class="tbp-icon tbp-h1">H1</span><span class="tbp-label">一级标题</span></button>
          <button class="tb-pop-item" data-cmd="h2"><span class="tbp-icon tbp-h2">H2</span><span class="tbp-label">二级标题</span></button>
          <button class="tb-pop-item" data-cmd="h3"><span class="tbp-icon tbp-h3">H3</span><span class="tbp-label">三级标题</span></button>
          <button class="tb-pop-item" data-cmd="p"><span class="tbp-icon tbp-p">T</span><span class="tbp-label">正文</span></button>
        </div>
      </div>
      <button class="tb" data-cmd="bold" title="加粗 Ctrl+B">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h9a4 4 0 0 0 0-8H6v8zm0 0v8m0-8h10a4 4 0 0 1 0 8H6v-8z"/></svg>
        <span>加粗</span>
      </button>
      <div class="tb-dropdown" id="colorPickerWrap">
        <button class="tb" data-dropdown="color" title="文字颜色">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="m6 16 6-12 6 12"/><path d="M8 12h8"/></svg>
          <span>颜色</span>
        </button>
        <div class="tb-popover color-popover" id="colorPickerPop" hidden>
          <div class="color-grid" id="colorPickerGrid"></div>
        </div>
      </div>
      <div class="tb-dropdown" id="bgPickerWrap">
        <button class="tb" data-dropdown="bg" title="文字背景色">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          <span>背景</span>
        </button>
        <div class="tb-popover color-popover" id="bgPickerPop" hidden>
          <div class="color-grid" id="bgPickerGrid"></div>
        </div>
      </div>
      <div class="tb-dropdown" id="moreFormatWrap">
        <button class="tb" data-dropdown="moreFormat" title="更多格式">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
          <span>其他</span>
        </button>
        <div class="tb-popover" id="moreFormatPop" hidden>
          <button class="tb-pop-item" data-cmd="italic">斜体</button>
          <button class="tb-pop-item" data-cmd="underline">下划线</button>
          <button class="tb-pop-item" data-cmd="strike">删除线</button>
          <button class="tb-pop-item" data-cmd="code">行内代码</button>
          <button class="tb-pop-item" data-cmd="formula">行内公式</button>
          <button class="tb-pop-item" data-cmd="clear">清除格式</button>
        </div>
      </div>
    </div>

    <!-- 段落 -->
    <div class="tb-group">
      <div class="tb-dropdown" id="listPickerWrap">
        <button class="tb" data-dropdown="list" title="列表">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="7" r="1.7"/><circle cx="5" cy="12" r="1.7"/><circle cx="5" cy="17" r="1.7"/><rect x="9.5" y="5.8" width="11" height="2.4" rx="1.2"/><rect x="9.5" y="10.8" width="11" height="2.4" rx="1.2"/><rect x="9.5" y="15.8" width="11" height="2.4" rx="1.2"/></svg>
          <span>列表</span>
        </button>
        <div class="tb-popover" id="listPickerPop" hidden>
          <button class="tb-pop-item" data-cmd="ul">无序列表</button>
          <button class="tb-pop-item" data-cmd="ol">有序列表</button>
        </div>
      </div>
      <div class="tb-dropdown" id="alignPickerWrap">
        <button class="tb" data-dropdown="align" title="对齐方式">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h12M3 18h18"/></svg>
          <span>对齐</span>
        </button>
        <div class="tb-popover" id="alignPickerPop" hidden>
          <button class="tb-pop-item" data-cmd="justifyLeft">左对齐</button>
          <button class="tb-pop-item" data-cmd="justifyCenter">居中</button>
          <button class="tb-pop-item" data-cmd="justifyRight">右对齐</button>
        </div>
      </div>
      <button class="tb" data-cmd="hr" title="分割线">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"/></svg>
        <span>水平线</span>
      </button>
      <button class="tb" data-cmd="quote" title="引用">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="3" height="16" rx="1.2"/><rect x="8" y="7" width="13" height="3" rx="1.5"/><rect x="8" y="14" width="13" height="3" rx="1.5"/></svg>
        <span>块引用</span>
      </button>
    </div>

    <!-- 插入 -->
    <div class="tb-group">
      <div class="tb-dropdown" id="codePickerWrap">
        <button class="tb" data-dropdown="code" title="代码">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
          <span>代码</span>
        </button>
        <div class="tb-popover" id="codePickerPop" hidden>
          <button class="tb-pop-item" data-cmd="code">行内代码</button>
          <button class="tb-pop-item" data-cmd="codeblock">代码块</button>
        </div>
        <div class="lang-picker-popover" id="langPickerPop" hidden>
          <div class="lang-picker-label">选择语言</div>
          <div class="lang-picker-list" id="langPickerList"></div>
        </div>
      </div>
      <div class="tb-dropdown" id="resPickerWrap">
        <button class="tb" data-dropdown="res" title="资源绑定">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m13.5 10.5-3 3"/><path d="M16 13a5 5 0 0 0-7.1 0l-2.8 2.8a5 5 0 0 0 7.1 7.1l1.4-1.4"/><path d="M8 11a5 5 0 0 1 7.1 0l2.8 2.8a5 5 0 0 1-7.1 7.1l-1.4-1.4"/></svg>
          <span>资源</span>
        </button>
        <div class="tb-popover" id="resPickerPop" hidden>
          <button class="tb-pop-item" data-cmd="link">链接</button>
          <button class="tb-pop-item" data-cmd="image">图片</button>
        </div>
      </div>
      <div class="tb-dropdown" id="tablePickerWrap">
        <button class="tb" id="tablePickerBtn" data-cmd="table" title="插入表格">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M3 9.6h18M3 14.6h18M9.5 9.6v9.9"/></svg>
          <span>表格</span>
        </button>
        <div class="table-picker-popover" id="tablePickerPop" hidden>
          <div class="table-picker-label" id="tablePickerLabel">3行 * 2列 表格</div>
          <div class="table-picker-grid" id="tablePickerGrid"></div>
        </div>
      </div>
    </div>

    <!-- 辅助 -->
    <div class="tb-group tb-group-right">
      <button class="tb" id="aiBtn" data-admin title="AI 续写">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 13.7 8l4.8 1.7-4.8 1.7L12 16.2 10.3 11.4 5.5 9.7l4.8-1.7z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>
        <span>AI</span>
      </button>
      <button class="tb" id="insertTplBtn" title="插入模板">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        <span>模板</span>
      </button>
      <button class="tb" id="importBtn" data-admin title="导入文章">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0-4 4m4-4 4 4"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
        <span>导入</span>
      </button>
      <button class="tb" id="exportBtn" data-admin title="导出文章">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0 4 4m-4-4-4 4"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
        <span>导出</span>
      </button>
      <input id="importFile" type="file" accept=".md,.html,.txt" hidden>
    </div>
  </div>

  <!-- 编辑区 + 预览区（CSDN 风格富文本：粘贴从别处复制的题目/博客原样保真） -->
  <div class="ed-panes" id="edPanes">
    <div id="edBody" class="ed-input md-body" contenteditable="true" spellcheck="false" data-placeholder="在这里写正文，或直接粘贴从 Codeforces / CSDN 等地方复制的题面与笔记，格式会原样保留…"></div>
    <div class="ed-preview md-body" id="edPreview"></div>
  </div>

</main>

<!-- AI 面板 -->
<div class="modal" id="aiModal" hidden>
  <div class="modal-box">
    <h2>AI 帮你写</h2>
    <p class="muted small">走站点自带的云端大模型，不用配任何 Key。选一个动作，选中正文里的相关段落会更准。</p>
    <div class="ai-acts">
      <button class="btn" data-admin data-ai="continue">接着往下写</button>
      <button class="btn" data-admin data-ai="improve">润色选中段</button>
      <button class="btn" data-admin data-ai="outline">拟一个提纲</button>
      <button class="btn" data-admin data-ai="explain">解释选中段</button>
      <button class="btn" data-admin data-ai="summary">写摘要</button>
      <button class="btn" data-admin data-ai="title">起几个标题</button>
    </div>
    <p id="aiHint" class="field-hint"></p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" data-close>关闭</button>
      <button type="button" class="btn primary" id="aiRun" data-admin disabled>开始</button>
    </div>
  </div>
</div>

<!-- 链接 / 图片 输入 -->
<div class="modal" id="linkModal" hidden>
  <div class="modal-box narrow">
    <h2 id="linkTitle">插入链接</h2>
    <label>地址
      <input id="linkUrl" placeholder="https://" autocomplete="off">
    </label>
    <label>文字
      <input id="linkText" placeholder="显示的文字" autocomplete="off">
    </label>
    <div class="modal-actions">
      <button type="button" class="btn ghost" data-close>取消</button>
      <button type="button" class="btn primary" id="linkOk">插入</button>
    </div>
  </div>
</div>

<!-- 管理分栏 -->
<div class="modal" id="colModal" hidden>
  <div class="modal-box">
    <h2>管理分栏</h2>
    <p class="muted small">「自定义栏」模式下，文章按这里的栏名归类（每篇属于一个栏）。删除某栏会把它名下的文章移回「未分栏」。</p>
    <ul id="colList" class="col-list"></ul>
    <div class="col-add">
      <input id="colNewName" placeholder="新栏名，如 题解 / 模板 / 复盘" maxlength="20" autocomplete="off">
      <button id="colAddBtn" class="btn">添加</button>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn ghost" data-close>关闭</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<!-- config.js 不入库（gitignore），GitHub Pages 上取不到；
     404 时同步回退到入库的 config.example.js -->
<script src="config.js"></script>
<script>
  if (!window.APP_CONFIG) {
    document.write('<script src="config.example.js"><\/script>');
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="common.js"></script>
<script src="api.js"></script>
<script src="notes.js"></script>
</body>
</html>
