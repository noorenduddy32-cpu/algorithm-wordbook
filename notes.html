<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的文章 · 算法学习笔记本</title>
<meta name="description" content="算法学习笔记本的文章模块：题解、思路复盘、模板与踩坑记录。">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="notes.css">
</head>
<body>

<div class="aurora-bg" aria-hidden="true"></div>

<header id="topbar" class="topbar"></header>

<!-- ============ 列表视图 ============ -->
<main id="listView" class="notes-wrap">

  <div class="notes-head">
    <div>
      <h1>我的文章</h1>
      <p class="muted" id="notesSub">题解、思路复盘、模板与踩坑记录，都存在云端。</p>
    </div>
    <div class="notes-head-actions">
      <div class="view-seg" id="viewSeg" title="列表 / 分栏视图">
        <button class="seg-btn active" data-view="list">列表</button>
        <button class="seg-btn" data-view="board">分栏</button>
      </div>
      <input id="noteSearch" type="search" placeholder="搜索标题 / 摘要 / 标签" autocomplete="off">
      <button id="newNoteBtn" class="btn primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
        写文章
      </button>
    </div>
  </div>

  <div class="notes-tabs" id="notesTabs" hidden>
    <button class="tab-btn active" data-tab="published">已发布</button>
    <button class="tab-btn" data-tab="draft">草稿箱</button>
  </div>

  <div class="board-bar" id="boardBar" hidden>
    <div class="seg" id="boardBySeg" title="分栏依据">
      <button class="seg-btn active" data-by="column">自定义栏</button>
      <button class="seg-btn" data-by="tag">按标签</button>
    </div>
    <button id="manageColBtn" class="btn ghost" data-admin>管理栏</button>
    <span class="board-hint muted small" id="boardHint"></span>
  </div>

  <div class="filter-row" id="tagFilter"></div>

  <div id="noteList" class="note-list"></div>
  <div id="boardView" class="board" hidden></div>

  <div id="notesEmpty" class="empty" hidden>
    <p>还没有文章</p>
    <p class="muted">点右上角「写文章」开始记第一篇</p>
  </div>

</main>

<!-- ============ 编辑器 ============ -->
<main id="editView" class="editor" hidden>

  <div class="ed-bar">
    <button id="edBack" class="btn ghost">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      返回
    </button>
    <span class="ed-status muted small" id="edStatus">草稿</span>
    <div class="spacer"></div>
    <div class="ed-count"><span id="edWords">0</span> 字</div>
    <div class="ed-mode" id="edMode" title="视图切换">
      <button class="seg-btn active" data-mode="edit" title="直接编辑">编辑</button>
      <button class="seg-btn" data-mode="preview" title="查看效果">预览</button>
    </div>
      <button id="delNoteBtn" class="btn ghost" data-admin hidden>删除</button>
      <button id="saveDraftBtn" class="btn ghost" data-admin>存草稿</button>
      <button id="publishBtn" class="btn primary" data-admin>发布</button>
  </div>

  <input id="edTitle" class="ed-title" placeholder="给这篇文章起个标题…" maxlength="120" autocomplete="off">

  <div class="ed-meta-row">
    <input id="edSummary" placeholder="摘要：写一句概括，会显示在文章列表（可留空自动生成）" autocomplete="off">
    <input id="edTags" placeholder="标签，逗号分隔：如 图论, 最短路, CF1900" list="tagList" autocomplete="off">
    <select id="edColumn" class="ed-col" title="所属分栏（自定义栏模式下生效；可在「管理栏」里增删）">
      <option value="">未分栏</option>
    </select>
    <select id="edVisibility" class="ed-visibility" title="发布后谁可见">
      <option value="public">访客模式</option>
      <option value="private">管理员模式</option>
    </select>
  </div>
  <datalist id="tagList">
    <option value="动态规划"></option><option value="图论"></option><option value="最短路"></option>
    <option value="网络流"></option><option value="树形DP"></option><option value="贪心"></option>
    <option value="字符串"></option><option value="数学"></option><option value="数论"></option>
    <option value="组合数学"></option><option value="数据结构"></option><option value="线段树"></option>
    <option value="树状数组"></option><option value="平衡树"></option><option value="搜索"></option>
    <option value="二分答案"></option><option value="分治"></option><option value="构造"></option>
    <option value="模拟"></option><option value="位运算"></option><option value="思维"></option>
    <option value="计算几何"></option><option value="博弈"></option><option value="差分约束"></option>
    <option value="最小生成树"></option><option value="拓扑排序"></option><option value="倍增"></option>
    <option value="DP优化"></option><option value="状压DP"></option><option value="概率期望"></option>
    <option value="前缀和"></option><option value="双指针"></option><option value="滑动窗口"></option>
    <option value="哈希"></option><option value="莫队"></option><option value="后缀数组"></option>
    <option value="CF1900"></option><option value="CF2100"></option><option value="CF2300"></option>
    <option value="Codeforces"></option><option value="ICPC"></option><option value="NOIP"></option>
  </datalist>

  <!-- 工具栏 -->
  <div class="ed-toolbar" id="edToolbar" data-admin>
    <div class="tb-group">
      <button class="tb" data-cmd="h2" title="二级标题">H2</button>
      <button class="tb" data-cmd="h3" title="三级标题">H3</button>
    </div>
    <div class="tb-group">
      <button class="tb" data-cmd="bold" title="加粗 Ctrl+B"><b>B</b></button>
      <button class="tb" data-cmd="italic" title="斜体 Ctrl+I"><i>I</i></button>
      <button class="tb" data-cmd="strike" title="删除线"><s>S</s></button>
    </div>
    <div class="tb-group">
      <button class="tb" data-cmd="code" title="行内代码">&lt;/&gt;</button>
      <button class="tb" data-cmd="codeblock" title="代码块">代码块</button>
    </div>
    <div class="tb-group">
      <button class="tb" data-cmd="ul" title="无序列表">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="7" r="1.7"/><circle cx="5" cy="12" r="1.7"/><circle cx="5" cy="17" r="1.7"/><rect x="9.5" y="5.8" width="11" height="2.4" rx="1.2"/><rect x="9.5" y="10.8" width="11" height="2.4" rx="1.2"/><rect x="9.5" y="15.8" width="11" height="2.4" rx="1.2"/></svg>
      </button>
      <button class="tb" data-cmd="ol" title="有序列表">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6.5h1.4M4 12h1.4M4 17.5h1.4M9 6.5h11M9 12h11M9 17.5h11"/></svg>
      </button>
      <button class="tb" data-cmd="quote" title="引用">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="3" height="16" rx="1.2"/><rect x="8" y="7" width="13" height="3" rx="1.5"/><rect x="8" y="14" width="13" height="3" rx="1.5"/></svg>
      </button>
    </div>
    <div class="tb-group">
      <div class="tb-dropdown" id="tablePickerWrap">
        <button class="tb" id="tablePickerBtn" data-cmd="table" title="插入表格">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M3 9.6h18M3 14.6h18M9.5 9.6v9.9"/></svg>
        </button>
        <div class="table-picker-popover" id="tablePickerPop" hidden>
          <div class="table-picker-label" id="tablePickerLabel">3行 * 2列 表格</div>
          <div class="table-picker-grid" id="tablePickerGrid"></div>
        </div>
      </div>
      <button class="tb" data-cmd="hr" title="分割线">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18"/></svg>
      </button>
      <button class="tb" data-cmd="link" title="链接 Ctrl+K">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13.5a4 4 0 0 0 5.7 0l2.8-2.8a4 4 0 0 0-5.7-5.7l-1.4 1.4"/><path d="M14 10.5a4 4 0 0 0-5.7 0l-2.8 2.8a4 4 0 0 0 5.7 5.7l1.4-1.4"/></svg>
      </button>
      <button class="tb" data-cmd="image" title="图片">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="15" rx="2"/><circle cx="8.5" cy="10" r="1.8"/><path d="M4 17.5 9.5 12l3.5 3.5 3-2.5 4 4.5"/></svg>
      </button>
      <button class="tb" data-cmd="formula" title="行内公式">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 20V7M6 7h6M6 7l-2.5-3M6 7l2.5-3"/><path d="M13 20l4-13h2l-4 13z"/></svg>
      </button>
    </div>
    <div class="tb-group">
      <button class="tb" id="aiBtn" data-admin title="用云端大模型帮你写">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 13.7 8l4.8 1.7-4.8 1.7L12 16.2 10.3 11.4 5.5 9.7l4.8-1.7z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>
        AI 续写
      </button>
      <button class="tb" id="insertTplBtn" title="插入算法笔记模板">模板</button>
    </div>
    <div class="tb-group">
      <button class="tb" id="importBtn" data-admin title="从文件导入（.md / .html）">导入</button>
      <button class="tb" id="exportBtn" data-admin title="导出当前文章（.html）">导出</button>
      <input id="importFile" type="file" accept=".md,.html,.txt" hidden>
    </div>
  </div>

  <!-- 编辑区 + 预览区（CSDN 风格富文本：粘贴从别处复制的题目/博客原样保真） -->
  <div class="ed-panes" id="edPanes">
    <div id="edBody" class="ed-input md-body" contenteditable="true" spellcheck="false" data-placeholder="在这里写正文，或直接粘贴从 Codeforces / CSDN 等地方复制的题面与笔记，格式会原样保留…"></div>
    <div class="ed-preview md-body" id="edPreview"></div>
  </div>

</main>

<!-- AI 面板 -->
<div class="modal" id="aiModal" hidden>
  <div class="modal-box">
    <h2>AI 帮你写</h2>
    <p class="muted small">走站点自带的云端大模型，不用配任何 Key。选一个动作，选中正文里的相关段落会更准。</p>
    <div class="ai-acts">
      <button class="btn" data-admin data-ai="continue">接着往下写</button>
      <button class="btn" data-admin data-ai="improve">润色选中段</button>
      <button class="btn" data-admin data-ai="outline">拟一个提纲</button>
      <button class="btn" data-admin data-ai="explain">解释选中段</button>
      <button class="btn" data-admin data-ai="summary">写摘要</button>
      <button class="btn" data-admin data-ai="title">起几个标题</button>
    </div>
    <p id="aiHint" class="field-hint"></p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" data-close>关闭</button>
      <button type="button" class="btn primary" id="aiRun" data-admin disabled>开始</button>
    </div>
  </div>
</div>

<!-- 链接 / 图片 输入 -->
<div class="modal" id="linkModal" hidden>
  <div class="modal-box narrow">
    <h2 id="linkTitle">插入链接</h2>
    <label>地址
      <input id="linkUrl" placeholder="https://" autocomplete="off">
    </label>
    <label>文字
      <input id="linkText" placeholder="显示的文字" autocomplete="off">
    </label>
    <div class="modal-actions">
      <button type="button" class="btn ghost" data-close>取消</button>
      <button type="button" class="btn primary" id="linkOk">插入</button>
    </div>
  </div>
</div>

<!-- 管理分栏 -->
<div class="modal" id="colModal" hidden>
  <div class="modal-box">
    <h2>管理分栏</h2>
    <p class="muted small">「自定义栏」模式下，文章按这里的栏名归类（每篇属于一个栏）。删除某栏会把它名下的文章移回「未分栏」。</p>
    <ul id="colList" class="col-list"></ul>
    <div class="col-add">
      <input id="colNewName" placeholder="新栏名，如 题解 / 模板 / 复盘" maxlength="20" autocomplete="off">
      <button id="colAddBtn" class="btn">添加</button>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn ghost" data-close>关闭</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<!-- config.js 不入库（gitignore），GitHub Pages 上取不到；
     404 时同步回退到入库的 config.example.js -->
<script src="config.js"></script>
<script>
  if (!window.APP_CONFIG) {
    document.write('<script src="config.example.js"><\/script>');
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="common.js"></script>
<script src="api.js"></script>
<script src="notes.js"></script>
</body>
</html>
