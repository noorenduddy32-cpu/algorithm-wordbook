<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(function(){
  try {
    var fs = parseInt(localStorage.getItem('wb_font_scale'), 10);
    if (isNaN(fs) || fs < 1 || fs > 100) fs = 50;
    var z = fs <= 50 ? 0.5 + (fs - 1) * (0.5 / 49) : 1 + (fs - 50) * (1 / 50);
    document.documentElement.style.zoom = z;
    var t = localStorage.getItem('wb_theme_v2');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<title>算法学习笔记本</title>
<meta name="description" content="个人算法学习笔记本：算法竞赛词汇本 + 题目笔记与题解文章。">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="home.css">
</head>
<body>

<div class="aurora-bg" aria-hidden="true"></div>

<header id="topbar" class="topbar"></header>

<main class="hub">

  <section class="hero">
    <h1 class="hero-title">算法学习笔记本</h1>
    <p class="hero-sub">题面里读不懂的词，收进词库；做过的题，写成文章。</p>
  </section>

  <section class="activity" id="activityWrap">
    <div class="activity-head">
      <h3>活跃度</h3>
      <span class="activity-sum" id="activitySum">今年 0 天有记录</span>
      <div class="activity-scale">
        <span class="muted small">少</span>
        <i class="act-cell l0"></i><i class="act-cell l1"></i><i class="act-cell l2"></i><i class="act-cell l3"></i><i class="act-cell l4"></i>
        <span class="muted small">多</span>
      </div>
    </div>
    <div class="activity-calendar">
      <div class="activity-calendar-inner">
        <div class="activity-months" id="activityMonths"></div>
        <div class="activity-body">
          <div class="activity-weekdays">
            <span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span>
          </div>
          <div class="activity-grid" id="activityGrid"></div>
        </div>
      </div>
    </div>
    <div class="activity-foot">
      <span><b id="actStreak">0</b> 天连续</span>
      <span><b id="actTotal">0</b> 次操作</span>
      <span><b id="actDays">0</b> 天活跃</span>
    </div>
  </section>

</main>

<footer class="page-foot">
  <span>算法学习笔记本 · 个人项目</span>
  <span class="muted small" id="footTip">正在连接云端…</span>
</footer>

<!-- 密码 -->
<div class="modal" id="passModal" hidden>
  <div class="modal-box narrow">
    <h2>编辑模式</h2>
    <p class="muted small">输入密码解锁「添加 / 编辑 / 删除 / 发布」。</p>
    <form id="passForm" autocomplete="off">
      <input id="passInput" type="password" placeholder="密码" autocomplete="off" required>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close>取消</button>
        <button type="submit" class="btn primary">解锁</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<!-- config.js 不入库（gitignore），GitHub Pages 上取不到；
     下面的脚本同步加载它，并在 404 时同步回退到入库的 config.example.js。
     注意必须同步：后两个脚本（common.js / home.js）依赖 APP_CONFIG 已就绪。 -->
<script src="config.js"></script>
<script>
  // config.js 404 时，浏览器不会创建 window.APP_CONFIG，这里补上模板配置
  if (!window.APP_CONFIG) {
    document.write('<script src="config.example.js"><\/script>');
  }
</script>
<script src="common.js"></script>
<script src="api.js"></script>
<script src="home.js"></script>
</body>
</html>
